name: MagangHub Attendance Reminder

on:
  schedule:
    # 18:00 WIB (UTC+7) = 11:00 UTC setiap hari
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run attendance reminder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_TO_EMAIL: ${{ secrets.REMINDER_TO_EMAIL }}
          PARTICIPANT_NAME: ${{ secrets.PARTICIPANT_NAME }}
          OFF_DAYS: ${{ secrets.OFF_DAYS }}
          EXTRA_HOLIDAYS: ${{ secrets.EXTRA_HOLIDAYS }}
          INTERNSHIP_START_DATE: '2026-08-10'
          INTERNSHIP_END_DATE: '2027-02-09'
          TIMEZONE: Asia/Jakarta
        run: npm start
