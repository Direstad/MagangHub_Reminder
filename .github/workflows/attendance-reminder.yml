name: MagangHub Attendance Reminder

on:
  schedule:
    # 18:00 WIB (UTC+7) = 11:00 UTC setiap hari
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  check-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run attendance check
        env:
          MAGANGHUB_AUTH_TOKEN: ${{ secrets.MAGANGHUB_AUTH_TOKEN }}
          MAGANGHUB_COOKIE: ${{ secrets.MAGANGHUB_COOKIE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REMINDER_TO_EMAIL: ${{ secrets.REMINDER_TO_EMAIL }}
          EXTRA_HOLIDAYS: ${{ secrets.EXTRA_HOLIDAYS }}
          TIMEZONE: Asia/Jakarta
        run: npm start
